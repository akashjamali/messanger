name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Select Xcode with iOS platform
        run: |
          set -euo pipefail
          SELECTED_XCODE=""
          for app in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app; do
            [ -d "$app" ] || continue
            if [ -d "$app/Contents/Developer/Platforms/iPhoneOS.platform" ]; then
              sudo xcode-select -s "$app"
              SELECTED_XCODE="$app"
              break
            fi
            echo "Skipping $app because iPhoneOS.platform is not installed"
          done
          if [ -z "$SELECTED_XCODE" ]; then
            echo "No installed Xcode with iPhoneOS.platform was found." >&2
            exit 1
          fi
          echo "Selected Xcode: $SELECTED_XCODE"

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          xcrun swift --version


      - name: Patch ExpoModulesJSI for Swift 6
        run: |
          python3 scripts/patch-expo-jsi.py
          chmod -R +x node_modules/expo-modules-jsi/apple/scripts/ || true
          python3 -c "p = 'node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh'; c = open(p).read().replace('-quiet', ''); open(p, 'w').write(c)" || true

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Re-apply patches after prebuild
        run: |
          python3 scripts/patch-expo-jsi.py

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Prebuild ExpoModulesJSI xcframework
        run: |
          PODS_ROOT="$PWD/ios/Pods" RN_ROOT="$PWD/node_modules/react-native" PLATFORM_NAME="iphoneos" bash node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh

      - name: Build unsigned iOS app with Xcode
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Messenger.xcworkspace \
            -scheme "Messenger" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          rm -rf Payload Messenger.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Messenger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-iOS-IPA
          path: ios/Messenger.ipa
          retention-days: 7
