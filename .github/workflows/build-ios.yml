name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install || true

      - name: Build unsigned iOS app with Xcode
        working-directory: ios
        run: |
          if ls -d *.xcworkspace 1>/dev/null 2>&1; then
            TARGET="-workspace $(ls -d *.xcworkspace | head -n 1)"
          else
            TARGET="-project $(ls -d *.xcodeproj | head -n 1)"
          fi
          echo "Using target: $TARGET"

          SCHEME="Messenger"
          echo "Building scheme: $SCHEME"

          xcodebuild \
            $TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          rm -rf Payload Messenger.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Messenger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-iOS-IPA
          path: ios/Messenger.ipa
          retention-days: 7
