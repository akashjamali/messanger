name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure Node symlinks for Xcode build phases
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node
          sudo ln -sf $(which node) /opt/homebrew/bin/node || true
          echo "Node at: $(which node)"
          node -v

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          sudo xcodebuild -runFirstLaunch || true

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks

      - name: Patch ExpoModulesJSI for Swift 6
        run: |
          python3 scripts/patch-expo-jsi.py
          chmod -R +x node_modules/expo-modules-jsi/apple/scripts/ || true
          python3 -c "p = 'node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh'; c = open(p).read().replace('-quiet', ''); open(p, 'w').write(c)" || true

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Re-apply patches after prebuild
        run: |
          python3 scripts/patch-expo-jsi.py

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Patch expo-router Toolbar iOS 26 APIs
        run: |
          # Use pre-patched vendored files (with #if compiler(>=6.2) guards).
          # Overwrite both node_modules and ios/Pods locations so Xcode sees the fixed versions.
          PATCH_DIR="patches/expo-router-toolbar"
          for DEST in \
            "node_modules/expo-router/ios/Toolbar" \
            "ios/Pods/ExpoRouter/Toolbar"; do
            if [ -d "$DEST" ]; then
              echo "Copying patched Toolbar files into: $DEST"
              cp "$PATCH_DIR/RouterToolbarHostView.swift" "$DEST/RouterToolbarHostView.swift"
              cp "$PATCH_DIR/RouterToolbarItemView.swift" "$DEST/RouterToolbarItemView.swift"
              cp "$PATCH_DIR/RouterToolbarModule.swift"   "$DEST/RouterToolbarModule.swift"
            else
              echo "Directory not found (skipping): $DEST"
            fi
          done
          echo "expo-router Toolbar patch complete."

      - name: Prebuild ExpoModulesJSI xcframework
        run: |
          python3 scripts/patch-expo-jsi.py
          PODS_ROOT="$PWD/ios/Pods" RN_ROOT="$PWD/node_modules/react-native" PLATFORM_NAME="iphoneos" bash node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh

      - name: Pre-bundle JavaScript & Assets
        run: |
          mkdir -p ios/assets
          npx expo export:embed --platform ios --dev false --entry-file node_modules/expo-router/entry.js --bundle-output ios/main.jsbundle --assets-dest ios
          ls -lh ios/main.jsbundle

      - name: Build iOS app with Xcode
        timeout-minutes: 60
        working-directory: ios
        run: |
          set -o pipefail

          # Detect workspace and scheme names dynamically
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
          echo "Building workspace: $WORKSPACE  scheme: $SCHEME"

          python3 ../scripts/patch-expo-jsi.py
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED: DETAILED COMPILER ERRORS ===================="
              grep -n -E "(error:|fatal error:|linker command failed|undefined symbol|build error)" xcodebuild.log | tail -n 60
              echo "==================== LAST 150 LINES OF BUILD LOG ===================="
              tail -n 150 xcodebuild.log
              exit 1
            }

      - name: Package .ipa with Embedded JS Bundle
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          
          # 1. Guarantee main.jsbundle is embedded in app root
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "Copying pre-built main.jsbundle into app bundle..."
            cp -v main.jsbundle "$APP_PATH/main.jsbundle"
          fi
          echo "App bundle contains main.jsbundle: $(ls -lh "$APP_PATH/main.jsbundle")"
          
          # 2. Copy bundled assets into app
          if [ -d "assets" ]; then
            cp -R assets "$APP_PATH/" || true
          fi
          
          # 3. Clean all AppleDouble resource files and extended attributes
          find "$APP_PATH" -name "._*" -delete || true
          find "$APP_PATH" -name ".DS_Store" -delete || true
          xattr -cr "$APP_PATH" || true
          
          # 4. Prepare clean Payload for sideloading
          rm -rf Payload LiquidGlassChat.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          find Payload -name "._*" -delete || true
          find Payload -name ".DS_Store" -delete || true
          xattr -cr Payload || true
          
          # 5. Create the IPA ready for Sideloadly / AltStore / Scarlet / TrollStore
          zip -r -y LiquidGlassChat.ipa Payload
          echo "IPA created successfully: $(ls -lh LiquidGlassChat.ipa)"

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassChat-iOS-IPA
          path: ios/LiquidGlassChat.ipa
          retention-days: 7

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: ios/xcodebuild.log
          retention-days: 3
